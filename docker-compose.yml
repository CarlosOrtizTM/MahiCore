services:
  db:
    image: postgres:16-alpine
    container_name: mahicore-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: mahi_admin
      POSTGRES_PASSWORD: mahi_local_dev
      POSTGRES_DB: mahicore
    ports:
      - "5436:5432"
    volumes:
      - mahicore_pgdata:/var/lib/postgresql/data
volumes:
  mahicore_pgdata:
